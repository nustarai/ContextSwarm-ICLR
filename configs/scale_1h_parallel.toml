extends = ["base.toml"]

[experiment]
name = "mobench-scale-1h-parallel"
mode = "parallel"
communication = "none"
max_parallel = 12
episodes_per_task = 1
max_attempts_per_task = 1
time_limit_seconds = 3600
output_root = "runs/1h_scaling"

[pi]
model = "openai-codex/gpt-5.6-sol"
thinking = "max"
timeout_seconds = 3600

[lean]
server_url = "http://127.0.0.1:19000"
max_concurrent_evaluations = 4
