extends = ["base.toml"]

[experiment]
name = "mobench-scale-1h-cps96"
mode = "cps"
communication = "blackboard"
max_parallel = 96
initial_agents_per_task = 8
max_attempts_per_task = 0
cancel_on_proved = true
assignment_policy = "least_active"
episodes_per_task = 2
time_limit_seconds = 3600
output_root = "runs/1h_scaling"

[pi]
model = "openai-codex/gpt-5.6-sol"
thinking = "max"
timeout_seconds = 3600

[lean]
server_url = "http://127.0.0.1:19000"
max_concurrent_evaluations = 4
