extends = ["_base.toml"]

[experiment]
name = "figure3-formal-matholympiadbench-nustigmergy"
output_root = "runs/figure3_formal/matholympiadbench/nustigmergy"

[selection]
selector_name = "nustigmergy"

[selection.policy_params]
interaction_mode = "nu"
weights = { relevance = 1.0, evidence = 1.0, interaction = 1.0, structure = 0.5, state = 0.5 }
kappa = 1.0
quota = 8
exploration = 0.0
score_precision = 8
tie_break = "trace_id_asc"
feedback_values = { useful = 1.0, not_useful = -1.0, misleading = -2.0, stale = -1.25, unsafe = -3.0, duplicate = -0.5, diagnostic_useful = 0.75, needs_refinement = -0.25, not_used = 0.0, route_attempted = 0.0, route_improving = 2.0 }

