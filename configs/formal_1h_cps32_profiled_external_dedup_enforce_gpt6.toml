extends = ["formal_1h_cps32_profiled_activity_advisory.toml"]

# Treatment arm for the external route-dedup comparison. The runner compares
# a new route declaration against bounded active peer summaries. A high-
# confidence overlap requires the Agent to switch unless it supplies an
# explicit independent-verification reason.
[experiment]
name = "mobench-formal-1h-cps32-profiled-external-dedup-enforce-gpt6"

[cps_features]
route_claim_required = true
route_claim_ttl_seconds = 3600
activity_feedback_prompt_mode = "advisory"
external_dedup_mode = "enforce"
external_dedup_similarity_threshold = 0.78
external_dedup_min_shared_tokens = 3
per_recipient_receipts = false
knowledge_promotion = false

[pi]
model = "openai-codex/gpt-6-astra"
