# Dataset overlay for putnambench; no arm-specific policy belongs here.
extends = ["_base.toml"]

[experiment]
dataset = "putnambench"
dataset_root = "benchmarks/putnambench"
problem_ids = "benchmarks/putnambench/problem_ids.json"

[judge]
kind = "formal"
env_id = "formal_putnambench"
verification_profile = "formal_proof"
judge_mode = "fast"

[formal_tools]
enabled = true
require_decl_index = true
