# Dataset overlay for clever; no arm-specific policy belongs here.
extends = ["_base.toml"]

[experiment]
dataset = "clever"
dataset_root = "benchmarks/clever"
problem_ids = "benchmarks/clever/problem_ids.json"

[judge]
kind = "formal"
env_id = "formal_clever"
verification_profile = "formal_proof"
judge_mode = "fast"

[formal_tools]
enabled = true
require_decl_index = true
