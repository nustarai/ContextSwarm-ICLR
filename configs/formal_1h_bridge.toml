extends = ["base.toml"]

# Shared controlled-Judge contract for the seven-arm scaling sweep.  The
# operator injects the Judge capabilities; no endpoint belongs in a manifest.
[experiment]
output_root = "runs/formal_1h_bridge"
time_limit_seconds = 3600

[pi]
model = "openai-codex/gpt-5.6-sol"
thinking = "max"
timeout_seconds = 3600

[lean]
max_concurrent_evaluations = 4
require_result_cache_disabled = true

[docker]
network = "bridge"
