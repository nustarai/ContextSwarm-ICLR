extends = ["formal_1h_bridge.toml"]

[experiment]
name = "mobench-formal-1h-cps96"
mode = "cps"
communication = "blackboard"
max_parallel = 96
initial_agents_per_task = 8
max_attempts_per_task = 0
cancel_on_proved = true
assignment_policy = "least_active"
episodes_per_task = 2

[allocation]
policy = "uniform"

[docker]
memory_mb = 32768
