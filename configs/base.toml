# Shared paper-facing contract.  Do not put API keys or AISW tokens here.

[experiment]
name = "mobench-cps"
dataset_root = "benchmarks/matholympiadbench"
problem_ids = "benchmarks/matholympiadbench/problem_ids.json"
output_root = "runs"
mode = "cps"
communication = "blackboard"
max_parallel = 24
initial_agents_per_task = 2
max_attempts_per_task = 0
cancel_on_proved = true
assignment_policy = "least_active"
episodes_per_task = 2
max_tasks = 0
time_limit_seconds = 3600
seed = 0

[pi]
model = "openai-codex/gpt-5.6-sol"
thinking = "max"
# Standard routing is the portable default for the compact artifact.  Set this
# to true only after the NuRouter coordinator exposes runtime-policy and
# explicitly allows fast mode.
fast_mode = false
timeout_seconds = 3600
# Pi's provider idle timeout is separate from the outer experiment horizon.
# Keep this explicit so Mono, Parallel, and CPS use the same retry contract.
http_idle_timeout_ms = 600000
# Leave binary empty in the manifest to use the mounted PI_BIN/AISW shim.
binary = ""
extension = "contextswarm_mini/pi_fast_mode.mjs"

[pi.retry]
enabled = true
max_retries = 10
base_delay_ms = 2000

[pi.retry.provider]
# Agent-level retry remains observable; avoid a second hidden SDK retry loop.
max_retries = 0
max_retry_delay_ms = 60000

[aisw]
enabled = true
binary = "~/.local/share/contextswarm/aisw-linux-aarch64"
node_config = "~/.nurouter/node.toml"
# Set this only when node.toml does not already provide coordinator_url.
coordinator_url = ""
account = ""
group = ""
lease_wait_seconds = 7200
lease_retry_interval_seconds = 2

[lean]
server_url = "http://127.0.0.1:18000"
env_id = "formal_matholympiadbench"
timeout_seconds = 300
max_lifecycle_seconds = 3600
max_concurrent_evaluations = 4
# One slot remains available to feedback-free outer closeout whenever total
# capacity is greater than one. This reservation is run-local; experiment
# cells still share the same external Judge service as before.
official_reserved_evaluations = 1
# Stop admitting optional solver feedback near the one-hour boundary so
# already-running probes can settle and the candidate set can freeze cleanly.
agent_local_cutoff_seconds = 330
# Solving still stops at experiment.time_limit_seconds. This separate bound is
# only for evaluating the already-frozen candidates.
closeout_timeout_seconds = 14400
verification_profile = "formal_proof"
judge_mode = "fast"

[formal_tools]
enabled = true
surface_version = "contextswarm_mini_formal_tools_v1"
evaluate_calls_per_task = 120
evaluate_backend_jobs_per_task = 120
query_calls_per_task = 60
query_backend_probes_per_task = 120
max_candidate_bytes = 2097152
# Pi's Bash tool must not terminate a legal 300-second Judge call first.
command_timeout_seconds = 420
# Supply a revision-matched index through an operator-local manifest or
# CONTEXTSWARM_MINI_DECL_INDEX. Formal preflight fails closed while this is
# required but missing; no paper run silently claims declaration search.
decl_index = ""
decl_index_sha256 = ""
mathlib_revision = ""
require_decl_index = true
pi_guard_extension = "contextswarm_mini/pi_worker_guard.mjs"

[docker]
image = "contextswarm-iclr-mini:latest"
memory_mb = 16384
internet = "online"
