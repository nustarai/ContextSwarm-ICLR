extends = ["base.toml"]

[experiment]
name = "mobench-mini-smoke"
mode = "cps"
communication = "blackboard"
max_parallel = 1
episodes_per_task = 1
max_tasks = 1
max_attempts_per_task = 2
time_limit_seconds = 30

[aisw]
enabled = false

[pi]
fast_mode = false
timeout_seconds = 10

[lean]
agent_local_cutoff_seconds = 0

[formal_tools]
# Offline orchestration smoke still stages both shims, but it has no Mathlib
# service/index contract to validate.
require_decl_index = false
